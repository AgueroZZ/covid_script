  appendix:
    baseline: artifacts/validation/manuscript_docx_update_20260831/baseline/appendix_accepted_baseline.docx
    baseline_sha256: 7c69b77d0494d89bb0448ec52b61ffc20a769ef9235ca38eae1fb7d238da6e81
    output: artifacts/validation/manuscript_docx_update_20260831/output/appendices_Aug31_2026_updated_tracked.docx
    replacements:
      - id: appendix_model_scope
        paragraph_index: 2
        new_markup: >-
          To analyze excess mortality in each stratified population across different regions, we use the following Bayesian log-Poisson time-series model, fitted independently to each region-by-stratum series rather than hierarchically pooled across series:
      - id: appendix_model_details
        paragraph_index: 4
        new_markup: >-
          Here y(tᵢ) denotes the all-cause mortality count for the given stratification group in the specified region at time tᵢ (measured in years), n denotes the number of observations before January 1, 2020, β₀ is an intercept, and oᵢ is a known offset. The long-term trend fₜᵣ follows a second-order integrated Wiener process; the seasonal component fₛ follows a yearly seasonal Gaussian process with four harmonics for weekly and monthly analyses and one annual harmonic for the quarterly Ireland analysis; and εᵢ is an observation-level Gaussian random effect for overdispersion. Independent penalized-complexity priors are placed on the standard-deviation scales. The trend prior is calibrated by P(five-year predictive SD > 0.1) = 0.01, the seasonal prior by P(one-year predictive SD > 0.1) = 0.01, and the overdispersion prior by P(σₑ > 0.1) = 0.01. Europe and England-and-Wales fits used BayesGP with five-point adaptive Gauss-Hermite quadrature specified explicitly; Ireland used the equivalent TMB implementation with five-point quadrature. US and Canadian fits used BayesGP with its four-point quadrature default. We retained 3,000 posterior samples for prediction.
      - id: appendix_offset
        paragraph_index: 5
        new_markup: >-
          For the United States, y(tᵢ) represents monthly all-cause mortality counts and oᵢ is the log of the number of calendar days in that month. The offset is zero for the weekly and quarterly analyses; no population-denominator offset is used. For Ireland, the latent weekly rate is aggregated over the weeks contributing to each quarterly observation in the Poisson likelihood, and posterior predictive mortality is drawn directly as quarterly Poisson counts.
      - id: appendix_pscore_scale
        paragraph_index: 6
        new_markup: >-
          The model in Eq. (1) was fitted using pre-pandemic mortality data before January 1, 2020. Expected mortality was represented by posterior predictive samples. Excess mortality at time t is the difference between observed mortality y(t) and predicted baseline mortality ŷ(t). The P-score is the excess divided by predicted mortality:
      - id: appendix_combined_age_by_figure
        paragraph_index: 8
        new_markup: >-
          Combined-age P-scores are calculated after aggregating observed and predicted deaths over the component age groups. Figure 4 uses ages 40–59 and 60–79 in both Europe and the US, giving ages 40–79. Figure 5 uses ages 40–59 and 60–79 in Europe, giving ages 40–79, and ages 0–44, 45–64, and 65–84 in the US, giving ages 0–84; its US older-adult panel uses ages 65–84 alone:
      - id: appendix_combined_age_j
        paragraph_index: 10
        new_markup: >-
          where yʲ(t) and ŷʲ(t) denote observed and predicted death counts for component age group j. J = 2 for the 40–79 combined-age estimand and J = 3 for the US 0–84 Figure 5 estimand; no aggregation is used for the single 65–84 panel.
      - id: appendix_pooling_method
        paragraph_index: 11
        new_markup: >-
          When comparing P-score series across groups of regions, pooled point estimates were obtained by fixed-effect inverse-variance weighting:
      - id: appendix_pooling_weights
        paragraph_index: 13
        new_markup: >-
          where πₖ is the normalized inverse of the posterior variance for the P-score in region k. Reported pooled uncertainty intervals use a normal approximation based on the inverse-variance sum.
      - id: appendix_pointwise_and_wave_pscore
        paragraph_index: 15
        new_markup: >-
          The pointwise P-score at time t is defined in Eq. (2). It is stored as a proportion, so 0.20 corresponds to 20% more observed than predicted deaths. Wave P-scores in Figures 2 and 3 and Table 1 are calculated by summing observed and posterior-predictive expected deaths over dates within the half-open wave interval before taking the ratio.
      - id: appendix_age_aggregation_summary
        paragraph_index: 16
        new_markup: >-
          For age-aggregated analyses, observed and predicted deaths are summed across the component age groups before the P-score is computed, so groups with more deaths contribute more to the combined result. The 40–79 estimand combines ages 40–59 and 60–79. The US 0–84 Figure 5 estimand combines ages 0–44, 45–64, and 65–84. The Figure 5 US older-adult panel is ages 65–84 and does not include ages ≥85.
      - id: appendix_sex_difference_sign
        paragraph_index: 17
        new_markup: >-
          Pointwise regional P-scores were pooled by inverse-variance weighting for high- and low-vaccination comparisons. Figure 5 reports the pooled female-minus-male P-score difference: positive values indicate higher female P-scores, and negative values indicate higher male P-scores.
