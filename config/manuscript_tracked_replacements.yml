    replacements:
      - id: abstract_heading
        paragraph_index: 8
        new_markup: "Abstract"
      - id: abstract_background
        paragraph_index: 9
        new_markup: >-
          [[bold:Background:]] Excess mortality during the COVID-19 pandemic varied markedly across regions, yet few studies systematically compared age- and sex-specific patterns across jurisdictions with different vaccination coverage using a common modeling framework.
      - id: abstract_methods
        paragraph_index: 10
        new_markup: >-
          [[bold:Methods:]] We fitted independent Bayesian log-Poisson time-series models to weekly, monthly, or quarterly all-cause mortality for 35 European geographies, the 50 US states and District of Columbia, and up to 10 Canadian provinces over source-specific periods ending in 2023 or 2024. We estimated age- and sex-specific P-scores and, for Europe and the US, compared fixed high- and low-vaccination cohorts defined using coverage on July 1, 2021 across Initial, Alpha, Delta, and Omicron waves; Canada was summarized separately.
      - id: abstract_findings
        paragraph_index: 11
        new_markup: >-
          [[bold:Findings:]] Vaccination-group contrasts varied by region. For ages 40–79 in Europe, median pooled P-scores in high- versus low-vaccination groups were 8.0% versus 30.6% during Alpha and 8.0% versus 36.4% during Delta; corresponding US values were 13.0% versus 17.9% and 21.2% versus 27.2%. Sex contrasts were also wave- and age-specific. During Delta, the pooled female-minus-male P-score difference was +9.4 percentage points for low-vaccination European ages 40–79 and +4.7 points for low-vaccination US ages 65–84, whereas several other strata favored males or were near zero.
      - id: abstract_interpretation
        paragraph_index: 12
        new_markup: >-
          [[bold:Interpretation:]] Higher vaccination coverage was associated with lower pooled Alpha and Delta P-scores, particularly in Europe, but these ecological comparisons do not establish individual-level effects. Age and sex patterns varied across regions and waves, supporting demographically stratified mortality surveillance and cautious evaluation of vaccination, social, and health-system context.
      - id: introduction_excess_mortality_context
        paragraph_index: 15
        new_markup: >-
          Official COVID-19 death tallies may undercount the pandemic's mortality burden because of limited testing and inconsistent attribution.[[sup:1]] Excess mortality—the difference between observed deaths and those expected from historical patterns—captures the net effect of deaths directly and indirectly related to the pandemic.[[sup:1–3]] Its geographic and demographic variation may reflect population structure, epidemic timing, health-system capacity, public-health responses, vaccination coverage, and other correlated factors. Region-level comparisons describe these patterns but cannot attribute them to a single cause.
      - id: introduction_comparative_settings
        paragraph_index: 17
        new_markup: >-
          Canada, the United States (US), and Europe provide comparative settings with substantial heterogeneity in pandemic response. Canada achieved high vaccination coverage through coordinated federal-provincial implementation and maintained strong public adherence to mitigation measures.[[sup:7,8]] The US demonstrated wide state-level variation in both policy and vaccine uptake.[[sup:9,10]] Within Europe, western countries experienced severe initial waves before achieving high vaccination rates, whereas eastern countries recorded large subsequent surges coinciding with persistently low vaccination.[[sup:11,12]] These contrasts motivate descriptive cross-regional comparisons while also requiring caution about confounding.
      - id: introduction_age_context
        paragraph_index: 19
        new_markup: >-
          Older adults face elevated COVID-19 mortality risk because of immunosenescence and comorbidity accumulation.[[sup:4]] Mortality was concentrated among older adults during the Initial wave,[[sup:13]] and vaccines were subsequently prioritized to many older populations. Later age-specific excess-mortality patterns varied across jurisdictions alongside vaccination uptake, epidemic timing, policy, prior infection, and healthcare context; jurisdiction-level comparisons cannot separate these influences.
      - id: introduction_objectives
        paragraph_index: 23
        new_markup: >-
          Despite extensive excess mortality research, many available comparisons lack consistent age- and sex-stratified baseline estimation across jurisdictions.[[sup:1,17]] We therefore applied a seasonally adaptive mortality model to source-specific age and sex strata in Europe, the United States, and Canada. We (1) quantified excess mortality at fine demographic resolution; (2) compared mortality burdens between fixed high- and low-vaccination cohorts defined using mid-2021 coverage; and (3) characterized temporal patterns across common pandemic-wave intervals. These analyses describe associations among demographic patterns, vaccination context, and pandemic phase rather than identifying causal effects.
      - id: methods_data_sources
        paragraph_index: 28
        new_markup: >-
          We conducted a retrospective, population-level analysis of all-cause mortality across Europe, the US, and Canada. We obtained weekly, monthly, or quarterly mortality counts, stratified by age and sex where available, from Eurostat for 33 geographies (January 3, 2000–May 6, 2024), the Office for National Statistics for England and Wales (January 5, 1981–August 28, 2023), Ireland's Central Statistics Office (March 31, 2010–March 31, 2023), Statistics Canada for 10 provinces and three territories (January 9, 2010–August 5, 2023), and US CDC WONDER (January 31, 1999–August 31, 2023). The England-and-Wales series measures death occurrences among usual residents through 2020 and registrations including non-residents from 2021 onward.
      - id: methods_frequency_and_counts
        paragraph_index: 30
        new_markup: >-
          Eurostat, England-and-Wales, and Canadian analyses used weekly counts; US analyses used monthly counts; and Ireland used quarterly counts. For Ireland, a latent weekly rate was aggregated over the weeks contributing to each quarterly observation in the Poisson likelihood, and posterior predictive counts were drawn directly at the quarterly level. The models were fitted to death counts without population-denominator offsets. The US model included only a calendar-month-length offset.
      - id: methods_age_bands
        paragraph_index: 33
        new_markup: >-
          We stratified deaths by age and sex wherever available. Eurostat and non-sex-stratified US analyses used ages 20–39, 40–59, 60–79, and ≥80. Sex-stratified US and Canadian analyses used ages 0–44, 45–64, 65–84, and ≥85. England and Wales provided Under 65, 65–84, and ≥85, whereas Ireland provided 25–44, 45–64, 65–84, and ≥85. In Figure 2, England-and-Wales and Ireland estimates are shown in the closest Eurostat panels as explicitly approximate mappings; the Under-65 England-and-Wales estimate is shown in both younger panels.
      - id: methods_vaccination_definition
        paragraph_index: 36
        new_markup: >-
          We classified jurisdictions using people with at least one vaccine dose per 100 people on July 1, 2021; for Europe, we used the latest measurement on or before that date. The fixed thresholds were strictly above 53% for high and strictly below 41% for low in Europe, and strictly above 62% for high and strictly below 42% for low in the US. Jurisdictions between the two thresholds, inclusive, were classified as neither and excluded from high-versus-low comparisons.
      - id: methods_europe_vaccination_cohort
        paragraph_index: 38
        new_markup: >-
          [[italic:Europe:]] The adopted high-vaccination cohort comprised Austria, Belgium, Denmark, Finland, Hungary, Italy, Portugal, and Spain; the low-vaccination cohort comprised Armenia, Bulgaria, Croatia, Latvia, Romania, Serbia, and Slovakia. Poland fell between the fixed thresholds and was not included. Hungary reached 55% coverage by mid-2021 but then stalled, relying more heavily than other European countries on Sinopharm and Sputnik vaccines.[[sup:19]]
      - id: methods_us_vaccination_cohort
        paragraph_index: 40
        new_markup: >-
          [[italic:United States:]] Figure 4 used Connecticut, Maine, Maryland, Massachusetts, New Hampshire, New Jersey, New Mexico, and Pennsylvania as the high-vaccination cohort and Alabama, Idaho, Louisiana, Mississippi, and Tennessee as the low-vaccination cohort. Figure 5 and Table 1 used the same low-vaccination cohort and omitted Maine and New Hampshire from the high-vaccination cohort. Arkansas, California, New York, and Texas fell between the fixed thresholds and were not included in the pooled vaccination comparisons.
      - id: methods_canada_context
        paragraph_index: 42
        new_markup: >-
          [[italic:Canada:]] Canada was summarized separately and was not assigned to either pooled vaccination cohort; descriptions of high Canadian coverage are contextual and based on external vaccination reports rather than the analytic vaccination registry.
      - id: methods_inclusion_missingness
        paragraph_index: 44
        new_markup: >-
          Vaccination-stratified analyses used the cohorts frozen for each reporting output. Figure 5 retained its historical 11-state US cohort and pooled only months commonly available within each vaccination group; incomplete Idaho and New Mexico strata were retained because a controlled sensitivity comparison showed a trivial effect during the manuscript period. The Canadian non-sex map included 10 provinces, whereas nine provinces passed the sex-stratified fitting gate; Prince Edward Island and all three territories ended before 2022 and were excluded from those fits.
      - id: methods_model_intro
        paragraph_index: 56
        new_markup: >-
          We fitted an independent Bayesian log-Poisson time-series model to each jurisdiction-by-age-by-sex series (Appendix A).[[sup:22,23]] These are separate stratum-specific fits rather than a hierarchical model that pools information across jurisdictions or strata. Each model used observations before January 1, 2020 and decomposed log mortality into a long-term trend, a seasonal component, and an observation-level random effect.
      - id: methods_iwp2
        paragraph_index: 57
        new_markup: >-
          [[bold:Secular trend:]] We modeled long-term mortality evolution using a second-order integrated Wiener process (IWP2), which provides flexible smooth trend estimation without imposing a fixed parametric form.
      - id: methods_seasonality
        paragraph_index: 59
        new_markup: >-
          [[bold:Seasonality:]] Weekly and monthly analyses used a yearly seasonal Gaussian process with four harmonics, corresponding to periods of 12, 6, 4, and 3 months.[[sup:22]] The quarterly Ireland analysis used one annual harmonic because higher harmonics are not identifiable at quarterly resolution. Seasonal amplitude was allowed to evolve gradually over time.
      - id: methods_overdispersion_inference
        paragraph_index: 61
        new_markup: >-
          [[bold:Overdispersion and inference:]] We included an observation-level Gaussian random effect with standard deviation σₑ to capture residual variation beyond Poisson sampling. Europe and England-and-Wales fits used BayesGP with five-point adaptive Gauss-Hermite quadrature specified explicitly; Ireland used the equivalent TMB implementation with five-point quadrature. US and Canadian fits used BayesGP with its four-point quadrature default. We retained 3,000 posterior samples for posterior predictive summaries. The trend prior was calibrated by P(five-year predictive SD > 0.1) = 0.01, the seasonal prior by P(one-year predictive SD > 0.1) = 0.01, and the overdispersion prior by P(σₑ > 0.1) = 0.01.
      - id: methods_figure1_wording
        paragraph_index: 65
        new_markup: >-
          To illustrate the independently fitted model, Figure 1 presents the Netherlands total-sex series for ages ≥80. The seasonal Gaussian-process component captures quasi-periodic variation in which winter peaks differ across years and propagates uncertainty in this seasonal pattern into the counterfactual mortality baseline.
      - id: methods_pscore_estimands
        paragraph_index: 71
        new_markup: >-
          The pointwise P-score is reported as a proportion, so p(t) = 0.20 denotes 20% more observed than expected deaths at time t. Figures 2 and 3 and Table 1 use wave P-scores calculated after summing observed and posterior-predictive expected deaths over all dates in the relevant half-open wave interval. Figure 4 displays inverse-variance-pooled pointwise P-score trajectories. Figure 5 displays the pooled pointwise female-minus-male P-score difference, for which positive values indicate higher female P-scores. Combined-age P-scores sum observed and expected deaths across component age groups before taking their ratio; reported pooled intervals use a fixed-effect normal approximation.
      - id: results_europe_map
        paragraph_index: 81
        new_markup: >-
          In Europe, the Delta wave showed strong spatial concentration in eastern Europe (Figure 2). For ages 40–59 and 60–79, respectively, wave-median P-scores were 63.7% and 61.6% in Bulgaria, 46.0% and 52.4% in Serbia, 33.3% and 47.7% in Romania, and 33.4% and 33.1% in Slovakia. These geographic differences coincided with, but do not by themselves identify effects of, vaccination coverage and other jurisdiction-level factors.
      - id: results_us_map
        paragraph_index: 82
        new_markup: >-
          In the United States, New York had the highest mapped Initial-wave median P-score for both ages 40–59 (51.0%) and 60–79 (44.6%). Delta-wave P-scores were elevated across many states, with high values in several low-vaccination states, including Mississippi, Louisiana, and Alabama (Figure 3). Arkansas was classified as neither rather than low under the fixed threshold rule.
      - id: results_vaccination_intro
        paragraph_index: 85
        new_markup: >-
          Pooled P-score trajectories differed by vaccination group and region (Figure 4). Because the groups were defined using July 1, 2021 coverage and were not randomized, the following contrasts are descriptive ecological associations. We summarize each wave using the median over dates of the pooled pointwise trajectory.
      - id: results_high_vaccination
        paragraph_index: 86
        new_markup: >-
          For ages 40–79 in Europe, the high-vaccination trajectory had median P-scores of 8.0% in both Alpha and Delta. The corresponding US high-vaccination medians were 13.0% in Alpha and 21.2% in Delta. These values were lower than those in the corresponding low-vaccination groups but were not uniformly near zero.
      - id: results_low_vaccination
        paragraph_index: 87
        new_markup: >-
          In the low-vaccination groups, European ages 40–79 had median pooled P-scores of 30.6% in Alpha and 36.4% in Delta, while the corresponding US medians were 17.9% and 27.2%. During Delta, the pooled pointwise trajectory reached 86.2% in Europe and 74.8% in the US for ages 40–79; the US ages 40–59 trajectory reached 116.3%. Weekly European data showed finer temporal variation than monthly US data.
      - id: results_vaccination_interpretation
        paragraph_index: 88
        new_markup: >-
          The larger Alpha and Delta P-scores in several low-vaccination cohorts are consistent with a population-level association between coverage and mortality, but the analysis cannot separate vaccination from correlated policy, epidemic-timing, demographic, healthcare, or socioeconomic differences.
      - id: results_age_intro
        paragraph_index: 90
        new_markup: >-
          The mapped analyses compare ages 40–59 with 60–79 rather than a universal oldest-age stratum (Figures 2 and 3). Their relative ordering varied by jurisdiction and wave, so we do not infer a single age gradient from these panels.
      - id: results_age_older
        paragraph_index: 91
        new_markup: >-
          For ages 60–79, European median pooled P-scores in high- versus low-vaccination groups were 7.4% versus 31.6% during Alpha and 8.0% versus 37.5% during Delta. Corresponding US values were 11.0% versus 16.3% and 18.4% versus 23.8%. Thus, high-vaccination trajectories were lower, but not uniformly close to zero.
      - id: results_age_middle
        paragraph_index: 92
        new_markup: >-
          For ages 40–59, European high- versus low-vaccination medians were 8.8% versus 26.0% during Alpha and 8.6% versus 31.8% during Delta. Corresponding US values were 19.1% versus 23.5% and 25.5% versus 40.7%. These source-aligned age bands replace the unsupported combined label of ages 40–64.
      - id: results_remove_supplement_pointer
        paragraph_index: 93
        new_markup: ""
      - id: results_sex_sign
        paragraph_index: 95
        new_markup: >-
          Sex differences varied by vaccination context, age stratum, and wave (Figure 5, Table 1). Figure 5 reports female-minus-male P-score differences, so negative values indicate higher male P-scores and positive values indicate higher female P-scores.
      - id: results_sex_high
        paragraph_index: 96
        new_markup: >-
          In the European high-vaccination group for ages 40–79, median female-minus-male differences were −3.4 percentage points in Alpha and +0.4 points in Delta. For US ages 0–84, the corresponding high-vaccination differences were −4.4 and +0.1 points. The direction and magnitude therefore varied rather than showing a stable 5–15-point male excess.
      - id: results_sex_europe_low
        paragraph_index: 97
        new_markup: >-
          In the European low-vaccination group for ages 40–79, median female-minus-male differences were +1.3 percentage points in Alpha and +9.4 points in Delta. At ages 60–79 in Table 1, Delta female P-scores exceeded male P-scores in Romania (61.4% versus 38.6%), Bulgaria (73.8% versus 54.1%), Serbia (60.1% versus 46.8%), and Slovakia (40.7% versus 27.7%).
      - id: results_sex_us
        paragraph_index: 98
        new_markup: >-
          US sex contrasts were also mixed. For ages 0–44, Alpha median female-minus-male differences were −2.2 percentage points in the high-vaccination group and −1.6 in the low-vaccination group, whereas Delta differences were +1.4 and +5.8 points. For low-vaccination ages 65–84, the Delta difference was +4.7 points (Figure 5f). These results do not support a male excess across every wave.
      - id: remove_supplement_heading
        paragraph_index: 99
        new_markup: ""
      - id: remove_unsupported_supplement_claims
        paragraph_index: 100
        new_markup: ""
      - id: discussion_summary
        paragraph_index: 103
        new_markup: >-
          Excess mortality varied substantially across North America and Europe by geography, age, sex, and pandemic wave. Fixed vaccination-group comparisons showed larger Alpha and Delta P-scores in several low-vaccination cohorts, especially in Europe, while sex contrasts varied in direction across strata. These ecological patterns are compatible with contributions from vaccination coverage and broader social, policy, epidemic-timing, and health-system context, but the present design cannot isolate their causal effects.
      - id: discussion_vaccination_heading
        paragraph_index: 105
        new_markup: "Vaccination-group differences in mortality trajectories"
      - id: discussion_vaccination_context
        paragraph_index: 106
        new_markup: >-
          Randomized trials established individual-level vaccine efficacy against severe outcomes.[[sup:24,25]] Our jurisdiction-level analysis addresses a different estimand: the association between fixed mid-2021 coverage groups and excess-mortality trajectories. Such contrasts may partly reflect transmission changes before Omicron,[[sup:26]] but they also incorporate differences in epidemic timing, policy, population composition, prior infection, and healthcare capacity.
      - id: discussion_vaccination_values
        paragraph_index: 107
        new_markup: >-
          The vaccination-group contrast was most pronounced in Europe. For ages 40–79, Alpha and Delta median pooled P-scores were 8.0% and 8.0% in the high-vaccination group versus 30.6% and 36.4% in the low-vaccination group. In the US, the corresponding values were 13.0% and 21.2% versus 17.9% and 27.2%. The smaller US separation underscores that vaccination group was not a complete explanation of between-state mortality heterogeneity.
      - id: discussion_age_heading
        paragraph_index: 108
        new_markup: "Age patterns across vaccination groups"
      - id: discussion_age_patterns
        paragraph_index: 109
        new_markup: >-
          Age-specific patterns differed across regions and vaccination groups. In both Europe and the US, Alpha and Delta pooled P-scores for ages 60–79 and 40–59 were generally lower in the adopted high-vaccination cohorts than in the low-vaccination cohorts, although the magnitudes and age ordering differed. Because source bands were not identical across all datasets and the analysis did not include individual vaccination status, these patterns should not be interpreted as direct age-specific vaccine effects.
      - id: discussion_age_mechanisms
        paragraph_index: 111
        new_markup: >-
          Several mechanisms could contribute to these descriptive patterns. Occupational exposure among working-age adults,[[sup:27,28]] healthcare-system strain,[[sup:29,30]] and differences in variant-associated hospitalization risk[[sup:31,32]] are plausible contextual factors. We did not measure these mechanisms directly, and the observed trajectories may also reflect prior infection, reporting practices, comorbidity distributions, and other unmeasured differences between jurisdictions.
      - id: discussion_sex_heading
        paragraph_index: 114
        new_markup: "Sex differences and possible structural context"
      - id: discussion_sex_patterns
        paragraph_index: 115
        new_markup: >-
          Sex contrasts varied by age, wave, and vaccination group rather than showing universal male excess. Established evidence identifies male biological vulnerability to severe COVID-19.[[sup:14,15,33]] In our pooled results, however, the European low-vaccination female-minus-male contrast was positive during Delta, and Table 1 showed higher female than male Delta P-scores at ages 60–79 in Romania, Bulgaria, Serbia, and Slovakia.
      - id: discussion_sex_hypotheses
        paragraph_index: 117
        new_markup: >-
          Occupational composition,[[sup:34]] unpaid caregiving,[[sup:35]] and barriers or delays in accessing care[[sup:36–38]] are plausible hypotheses for context-specific sex differences. The mortality datasets contain none of these variables, so the present analysis cannot determine whether these mechanisms produced the observed contrasts.
      - id: discussion_sex_causal_caution
        paragraph_index: 118
        new_markup: >-
          The clustering of some female-higher contrasts in low-vaccination settings is an ecological observation. It does not demonstrate that vaccination coverage caused a reversal or that structural factors, rather than biological or compositional differences, were responsible.
      - id: limitations_data_quality
        paragraph_index: 123
        new_markup: >-
          First, vital-registration data may contain reporting delays, incomplete registration, cross-national coding differences, or suppressed cells. The England-and-Wales source changes from occurrences among usual residents through 2020 to registrations including non-residents from 2021. CDC WONDER suppression produces incomplete younger-age strata in some smaller states; Figure 5 retains Idaho and New Mexico and uses months commonly available within vaccination group. These features can affect geographic and age-sex comparisons.
      - id: limitations_all_cause
        paragraph_index: 125
        new_markup: >-
          Second, all-cause mortality includes deaths directly and indirectly related to the pandemic. It avoids dependence on COVID-19 death-certificate attribution, but it cannot partition direct SARS-CoV-2 deaths from deaths associated with delayed care, healthcare disruption, mental-health crises, substance use, or unrelated changes. We did not conduct a cause-specific sensitivity analysis.
      - id: limitations_vaccination
        paragraph_index: 127
        new_markup: >-
          Third, vaccination coverage was assigned geographically at a single reference date, July 1, 2021, rather than at the individual level or as a time-varying exposure. The binary high/low groups omit jurisdictions between the thresholds, cannot capture within-jurisdiction heterogeneity, and do not establish individual-level causal effects. We did not conduct a continuous-coverage sensitivity analysis.
      - id: limitations_counterfactual
        paragraph_index: 129
        new_markup: >-
          Fourth, expected deaths were extrapolated from pre-2020 trends. This counterfactual assumes that the estimated secular and seasonal processes would have continued in the absence of the pandemic and may not capture unrelated structural changes. Model misspecification or pre-pandemic trend changes could therefore affect estimated P-scores.
      - id: policy_implications
        paragraph_index: 134
        new_markup: >-
          These results support continued attention to vaccine access and uptake, but the ecological design does not quantify preventable deaths or individual-level vaccine effectiveness. The observed Alpha and Delta differences between fixed vaccination cohorts should be interpreted alongside evidence from randomized trials and individual-level observational studies and alongside differences in policy, prior infection, healthcare capacity, and population composition.
      - id: policy_structural_context
        paragraph_index: 136
        new_markup: >-
          Pandemic preparedness should also address occupational exposure, caregiving responsibilities, and barriers to healthcare access. These factors were not tested as mediators in this study, but prior evidence supports monitoring them together with age- and sex-stratified mortality.
      - id: policy_international_cooperation
        paragraph_index: 138
        new_markup: >-
          International cooperation can strengthen preparedness. Comparing outcomes across jurisdictions supports learning from different responses and identifying adaptable practices; maintaining timely, demographically stratified mortality surveillance should remain a global health-security priority.
      - id: conclusion
        paragraph_index: 141
        new_markup: >-
          Excess mortality patterns varied substantially across geography, age, sex, and pandemic wave. Fixed low-vaccination cohorts generally had higher pooled Alpha and Delta P-scores than high-vaccination cohorts, with a larger separation in Europe than in the US, while sex differences changed direction across some strata. These descriptive ecological findings support demographically stratified surveillance and motivate further causal investigation using individual-level vaccination, infection, social, and healthcare data.
      - id: context_added_value_model
        paragraph_index: 152
        new_markup: >-
          This study applies a common Bayesian log-Poisson framework to weekly, monthly, or quarterly all-cause mortality across Canada, the USA, and Europe while retaining source-specific age bands. Independent stratum-specific models combine an IWP2 secular trend, an evolving seasonal Gaussian process, and an overdispersion term, providing posterior-predictive counterfactual mortality estimates without implying cross-jurisdictional hierarchical pooling.
      - id: context_added_value_findings
        paragraph_index: 154
        new_markup: >-
          We add three descriptive findings. First, pooled Alpha and Delta P-scores were generally higher in the fixed low-vaccination cohorts, with a larger contrast in Europe than in the US. Second, female-minus-male P-score differences varied by age and wave and became positive in some low-vaccination Delta strata. Third, the source-aligned analysis provides comparable age- and sex-specific summaries across dozens of jurisdictions while explicitly identifying approximate England-and-Wales and Ireland age mappings.
      - id: context_implications_vaccination
        paragraph_index: 157
        new_markup: >-
          Together with trial and individual-level evidence, the ecological vaccination-group patterns support vaccine access and uptake as important components of pandemic response. The present analysis does not establish vaccination coverage as the strongest determinant, assume similar viral exposure, or isolate vaccination from correlated policy, demographic, epidemic-timing, and healthcare differences.
      - id: context_implications_sex
        paragraph_index: 159
        new_markup: >-
          Sex differences in excess mortality were not constant across contexts. Their variation motivates surveillance that jointly stratifies by age and sex and future studies that directly measure occupational, caregiving, healthcare-access, comorbidity, and vaccination pathways rather than inferring them from regional contrasts.
      - id: context_final_statement
        paragraph_index: 161
        new_markup: >-
          These results support demographically stratified mortality surveillance and careful integration of ecological excess-mortality patterns with stronger causal evidence when planning future vaccination and structural-protection strategies.
      - id: data_sharing
        paragraph_index: 173
        new_markup: >-
          All source data were obtained from publicly available agencies. The reproducible data-processing, model-fitting, analysis, figure, and table scripts are available on GitHub (https://github.com/AgueroZZ/covid_script). Large fitted-model and frozen reporting artifacts required for exact reproduction will be archived on Zenodo; the final DOI will be inserted before submission.
      - id: reference_16_published_update
        paragraph_index: 193
        new_markup: >-
          16. Doniec K, Schöley J, Kühn M, Dowd JB. Sex differences in excess mortality during the COVID-19 pandemic: a longitudinal ecological analysis of 34 high-income countries. [[italic:EClinicalMedicine]]. 2026;98:104072. doi:10.1016/j.eclinm.2026.104072
