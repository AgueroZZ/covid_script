  title: Fitted mortality models and reporting inputs for a multi-country COVID-19 excess mortality analysis
  description: >-
    Canonical fitted mortality objects, compact diagnostics, standardized
    reporting inputs, and map geometry used to reproduce the adopted figures
    and table for a multi-country analysis of excess mortality during the
    COVID-19 pandemic. Exact raw-data snapshots and analysis code are versioned
    in the linked GitHub repository.
